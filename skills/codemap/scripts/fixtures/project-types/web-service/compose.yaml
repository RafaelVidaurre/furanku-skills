services:
  ingress:
    image: nginx:alpine
    ports: ["8088:80"]
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [api]
  api:
    image: python:3.12-slim
    working_dir: /app
    command: ["python", "server.py"]
    environment:
      READING_DB: /data/reading.sqlite
    volumes: [".:/app:ro", "reading-data:/data"]
volumes:
  reading-data:
